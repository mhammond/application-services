[package]
name = "shared-settings"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
exclude = ["/android"]

[dependencies]
anyhow = "1"
error-support = { path = "../support/error" }
serde = "1"
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.31" }
webext-storage = { path = "../webext-storage" }

[dev-dependencies]
error-support = { path = "../support/error", features = ["testing"] }
webext-storage = { path = "../webext-storage", features = ["testing"] }
