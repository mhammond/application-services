[package]
name = "shared-settings"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
exclude = ["/android"]

[dependencies]
anyhow = "1"
error-support = { path = "../support/error" }
lazy_static = "1.4"
parking_lot = ">=0.11,<=0.12"
serde = "1"
serde_json = "1"
sync15 = { path = "../sync15", features = ["sync-engine"] }
thiserror = "2"
uniffi = { version = "0.31" }
webext-storage = { path = "../webext-storage" }

[dev-dependencies]
error-support = { path = "../support/error", features = ["testing"] }
webext-storage = { path = "../webext-storage", features = ["testing"] }
